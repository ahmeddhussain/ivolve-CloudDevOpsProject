---
- name: Install jenkins-plugin-cli pinned plugin set
  copy:
    src: plugins.txt
    dest: /var/lib/jenkins/plugins.txt
    owner: jenkins
    group: jenkins
    mode: '0644'

- name: Run jenkins-plugin-cli to install pinned plugins
  command: >
    jenkins-plugin-cli
    --plugin-file /var/lib/jenkins/plugins.txt
    --plugin-download-directory /var/lib/jenkins/plugins
  become: true
  become_user: jenkins

- name: Ensure JCasC config directory exists
  file:
    path: /var/lib/jenkins/casc_configs
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Deploy JCasC configuration file
  copy:
    src: jenkins.yaml
    dest: /var/lib/jenkins/casc_configs/jenkins.yaml
    owner: jenkins
    group: jenkins
    mode: '0644'

- name: Set CASC_JENKINS_CONFIG and admin credentials as Jenkins env vars
  lineinfile:
    path: /etc/default/jenkins
    line: "{{ item }}"
    create: yes
  loop:
    - 'CASC_JENKINS_CONFIG=/var/lib/jenkins/casc_configs/jenkins.yaml'
    - 'JENKINS_ADMIN_USER={{ vault_jenkins_admin_user }}'
    - 'JENKINS_ADMIN_PASSWORD={{ vault_jenkins_admin_password }}'

- name: Restart Jenkins to apply plugins + JCasC config
  service:
    name: jenkins
    state: restarted

- name: Wait for Jenkins port 8080 to be ready
  wait_for:
    port: "{{ jenkins_port }}"
    delay: 10
    timeout: 180