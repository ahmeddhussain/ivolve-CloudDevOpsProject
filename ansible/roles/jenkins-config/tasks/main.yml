---
- name: Wait for Jenkins initial admin password file
  wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    state: present
    timeout: 120

- name: Ensure init.groovy.d directory exists
  file:
    path: /var/lib/jenkins/init.groovy.d
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0755'

- name: Create Groovy script to download suggested plugins & create admin user
  copy:
    dest: /var/lib/jenkins/init.groovy.d/setup-jenkins.groovy
    owner: jenkins
    group: jenkins
    mode: '0644'
    content: |
      import jenkins.model.*
      import hudson.security.*
      import jenkins.install.InstallState

      def instance = Jenkins.getInstance()

      // 1. Create admin user from Vault variables
      try {
          def hudsonRealm = new HudsonPrivateSecurityRealm(false)
          hudsonRealm.createAccount('{{ vault_jenkins_admin_user }}', '{{ vault_jenkins_admin_password }}')
          instance.setSecurityRealm(hudsonRealm)

          def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
          instance.setAuthorizationStrategy(strategy)
      } catch (Exception e) {
          println("User creation failed: " + e)
      }

      // 2. Install required plugins
      try {
          def pm = instance.getPluginManager()
          def uc = instance.getUpdateCenter()

          uc.updateAllSites()
          def site = uc.getById("default")
          if (site != null) {
              site.updateDirectlyNow(false)
          }

          def plugins = [
              'cloudbees-folder',
              'build-timeout',
              'credentials-binding',
              'timestamper',
              'ws-cleanup',
              'workflow-aggregator',
              'pipeline-stage-view',
              'git',
              'github',
              'docker-workflow',
              'sonar'
          ]

          plugins.each { pluginName ->
              if (!pm.getPlugin(pluginName)) {
                  def plugin = site ? site.getPlugin(pluginName) : null
                  if (plugin) {
                      def deployment = plugin.deploy(true)
                      deployment.get()
                  }
              }
          }
      } catch (Exception e) {
          println("Plugin installation failed: " + e)
      }

      // 3. Mark setup wizard as complete
      try {
          instance.setInstallState(InstallState.INITIAL_SETUP_COMPLETED)
      } catch (Exception e) {
          println("Wizard state update failed: " + e)
      }

      instance.save()

- name: Restart Jenkins to execute Groovy setup script
  service:
    name: jenkins
    state: restarted

- name: Wait for Jenkins port 8080 to be ready
  wait_for:
    port: "{{ jenkins_port }}"
    delay: 10
    timeout: 180